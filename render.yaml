# Render deployment konfiguration for ADD SmartRegnskab
# https://render.com/docs/blueprint-spec
# Opret en ny web service på Render og vælg dette repository.

services:
  - type: web
    name: add-smartregnskab
    runtime: node
    plan: starter           # $7/mo — opgrader til standard ved behov
    region: frankfurt       # Tættest på Danmark
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true

    # NODE_ENV=production er allerede sat under Render-buildet. Medtag derfor
    # eksplicit devDependencies, fordi build-scriptet bruger tsx/Vite/esbuild.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/migrate-sqlite-prod.mjs && node dist/index.cjs

    # ── Persistent disk (kritisk for SQLite + filer) ──
    disk:
      name: smartregnskab-data
      mountPath: /var/data
      sizeGB: 5              # Start med 5 GB, kan udvides senere

    envVars:
      # ── Database & filer (peger mod persistent disk) ──
      - key: DATABASE_PATH
        value: /var/data/data.db
      - key: FILE_STORAGE_DIR
        value: /var/data/files
      - key: BACKUP_DIR
        value: /var/data/backups

      # ── App ──
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false          # Sæt til SmartRegnskabs selvstændige produktionsadresse
      - key: ALLOWED_ORIGINS
        sync: false          # Kommasepareret liste over tilladte web/native origins

      # ── Første platformadministrator ──
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false          # Mindst 12 tegn; opbevares som secret
      - key: PLATFORM_COMPANY_NAME
        value: ADD SmartDrift ApS
      - key: PLATFORM_COMPANY_CVR
        value: "46761898"
      - key: PLATFORM_COMPANY_ADDRESS
        value: Lynæs Søpark 49, 3390 Hundested
      - key: PLATFORM_INVOICE_EMAIL
        value: regnskab@addsmartregnskab.dk

      # ── Kryptering (KRITISK — generer med: openssl rand -hex 32) ──
      - key: ENCRYPTION_KEY
        sync: false          # Sæt til en 64-char hex streng

      # ── QuickPay (abonnementer og betalinger) ──
      - key: QUICKPAY_API_KEY
        sync: false
      - key: QUICKPAY_PRIVATE_KEY
        sync: false
      - key: QUICKPAY_SETUP_AMOUNT_ORE
        value: "0"

      # ── AiiA / Mastercard Open Banking ──
      - key: AIIA_CLIENT_ID
        sync: false
      - key: AIIA_CLIENT_SECRET
        sync: false
      - key: AIIA_BASE_URL
        value: https://api.aiia.eu
      - key: AIIA_REDIRECT_URI
        value: https://app.addsmartregnskab.dk/api/bank/aiia/callback
      - key: AIIA_SCOPES
        value: accounts offline_access

      # ── Email (Resend) ──
      - key: RESEND_API_KEY
        sync: false          # re_... fra Resend
      - key: MAIL_FROM
        sync: false          # Fx regnskab@virksomhedens verificerede domæne

      # ── SMS (valgfrit) ──
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false

      # ── MobilePay (valgfrit) ──
      - key: MOBILEPAY_CLIENT_ID
        sync: false
      - key: MOBILEPAY_CLIENT_SECRET
        sync: false
      - key: MOBILEPAY_WEBHOOK_SECRET
        sync: false

      # ── S3 filstorage (valgfrit — alternativ til lokal disk) ──
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false          # Valgfri URL til fx Cloudflare R2/Backblaze B2
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_BACKUP_PREFIX
        value: smartregnskab/backups
      - key: S3_BACKUP_RETENTION_DAYS
        value: "35"
