name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "client/**", "server/**", "shared/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: "Byg en signeret produktions-AAB"
        required: true
        type: boolean
        default: false
      upload_to_play:
        description: "Upload til Google Plays interne testspor"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PACKAGE_NAME: dk.smartregnskab.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Kontrollér workflowvalg
        if: ${{ inputs.upload_to_play && !inputs.build_signed_release }}
        run: exit 1
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx cap sync android
      - name: Gør Gradle-wrapper eksekverbar
        run: chmod +x android/gradlew
      - name: Byg og test debug-APK
        if: ${{ !inputs.build_signed_release }}
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Gem debug-APK
        if: ${{ !inputs.build_signed_release }}
        uses: actions/upload-artifact@v4
        with:
          name: ADD-SmartRegnskab-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Kontrollér signeringshemmeligheder
        if: ${{ inputs.build_signed_release }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KSA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$KS" "$KSP" "$KSA" "$KP"; do test -n "$value" || exit 1; done
      - name: Installer uploadnøgle
        if: ${{ inputs.build_signed_release }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo -n "$KS" | base64 --decode > "$RUNNER_TEMP/add-smartregnskab-upload.jks"
      - name: Byg signeret AAB
        if: ${{ inputs.build_signed_release }}
        working-directory: android
        env:
          SMARTREGNSKAB_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/add-smartregnskab-upload.jks
          SMARTREGNSKAB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMARTREGNSKAB_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMARTREGNSKAB_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - name: Verificér og gem AAB
        if: ${{ inputs.build_signed_release }}
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_signed_release }}
        with:
          name: ADD-SmartRegnskab-Android-3.16.3-release
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload til Google Play intern test
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Ryd uploadnøgle
        if: ${{ always() && inputs.build_signed_release }}
        run: rm -f "$RUNNER_TEMP/add-smartregnskab-upload.jks"
