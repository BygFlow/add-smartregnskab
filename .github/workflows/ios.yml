name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "client/**", "server/**", "shared/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/ios.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Byg en signeret IPA og upload til TestFlight"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync:ios
      - name: Byg iPhone/iPad-simulatorapp
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Pak simulatorapp
        run: ditto -c -k --sequesterRsrc --keepParent build/ios-simulator/Build/Products/Release-iphonesimulator/App.app ADD-SmartRegnskab-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ADD-SmartRegnskab-iOS-Simulator
          path: ADD-SmartRegnskab-iOS-Simulator.zip

  testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: dk.smartregnskab.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Kontrollér Apple-hemmeligheder
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASS: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          for value in "$APPLE_TEAM_ID" "$KEY_ID" "$ISSUER_ID" "$CERT" "$CERT_PASS" "$PROFILE" "$KEYCHAIN_PASS" "$API_KEY"; do test -n "$value" || exit 1; done
      - run: npm ci && npm run mobile:sync:ios
      - name: Installer certifikat og profil
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASS: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$CERT" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          echo -n "$PROFILE" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASS" "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$RUNNER_TEMP/signing.keychain-db"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Arkivér og eksportér IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ADD-SmartRegnskab.xcarchive" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>destination</key><string>export</string><key>method</key><string>app-store-connect</string><key>signingStyle</key><string>manual</string><key>teamID</key><string>$APPLE_TEAM_ID</string><key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict></dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ADD-SmartRegnskab.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          echo "IPA_PATH=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)" >> "$GITHUB_ENV"
      - name: Upload til TestFlight
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$API_KEY" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ADD-SmartRegnskab-iOS-3.16.3-31603
          path: ${{ env.IPA_PATH }}
      - name: Ryd signeringsfiler
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing.keychain-db" "$HOME/.appstoreconnect/private_keys"
